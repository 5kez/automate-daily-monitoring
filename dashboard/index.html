<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Server Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0d1117;
        color: #c9d1d9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        line-height: 1.6;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #30363d;
      }
      th {
        background: #161b22;
        font-weight: 600;
      }
      tr:hover {
        background: #0d1117;
      }
      button {
        background: #0052CC;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 6px;
        transition: background 0.2s;
      }
      button:hover {
        background: #0066FF;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
