name: Docker CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop and Remove old container
        shell: powershell
        run: |
          # เช็คว่ามี Container ชื่อ web-container-2 รันอยู่หรือไม่
          $container = docker ps -a --filter "name=web-container-2" --format "{{.Names}}"
          if ($container -eq "web-container-2") {
              Write-Host "Stopping and removing existing container..."
              docker stop web-container-2
              docker rm web-container-2
          } else {
              Write-Host "No existing container found. Skipping..."
          }

      - name: Build Docker Image
        shell: powershell
        run: docker build -t webtest-new .

      - name: Run New Container
        shell: powershell
        run: docker run -d --name sms-report -p 8766:80 sms-report